<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Laptop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-form input {
            flex: 2;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }
        .search-form select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
        }
        .search-form button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-form button:hover {
            background-color: #0056b3;
        }
        .detected-info {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #495057;
        }
        .requirements, .selected-specs {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .game-req, .spec-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .game-req h4 {
            margin: 0 0 8px 0;
            color: #007bff;
        }
        .req-row, .spec-row {
            font-size: 0.85em;
            margin: 5px 0;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #888;
            margin: 20px;
        }
        .error {
            color: red;
            text-align: center;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .category-recommended {
            background-color: #d4edda;
            color: #155724;
        }
        .category-mixed {
            background-color: #fff3cd;
            color: #856404;
        }
        .category-minimum {
            background-color: #cce5ff;
            color: #004085;
        }
        .footer-note {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .spec-title {
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rekomendasi Laptop</h1>
        <div class="search-form">
            <input type="text" id="query" placeholder="Contoh: laptop asus rog 16gb ram buat spiderman remastered" />
            <label for="limit" style="margin-left: 10px;">Jumlah:</label>
            <select id="limit">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <button onclick="search()">Cari Laptop</button>
        </div>
        <div id="detectedInfo" class="detected-info" style="display: none;"></div>
        <div id="requirementsArea" class="requirements" style="display: none;"></div>
        <div id="selectedSpecsArea" class="selected-specs" style="display: none;"></div>
        <div id="resultArea"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/recommend';

        async function search() {
            const query = document.getElementById('query').value.trim();
            const limit = document.getElementById('limit').value;
            if (!query) {
                alert('Silakan masukkan query pencarian.');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const detectedInfo = document.getElementById('detectedInfo');
            const requirementsArea = document.getElementById('requirementsArea');
            const selectedSpecsArea = document.getElementById('selectedSpecsArea');
            resultArea.innerHTML = '<div class="loading">Memuat rekomendasi...</div>';
            detectedInfo.style.display = 'none';
            requirementsArea.style.display = 'none';
            selectedSpecsArea.style.display = 'none';

            try {
                const url = `${API_URL}?query=${encodeURIComponent(query)}&limit=${limit}`;
                const response = await fetch(url);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const data = await response.json();

                if (data.status === 'success') {
                    // Tampilkan info deteksi
                    let infoHtml = '';
                    if (data.detected_games && data.detected_games.length > 0) {
                        infoHtml += `<strong>🎮 Game terdeteksi:</strong> ${data.detected_games.join(', ')}<br>`;
                    }
                    if (data.detected_laptops && data.detected_laptops.length > 0) {
                        infoHtml += `<strong>💻 Laptop/Brand terdeteksi:</strong> ${data.detected_laptops.join(', ')}<br>`;
                    }
                    if (data.detected_budget) {
                        infoHtml += `<strong>💰 Budget terdeteksi:</strong> Rp ${data.detected_budget}<br>`;
                    }
                    if (data.detected_ram && data.detected_ram.length > 0) {
                        infoHtml += `<strong>⚡ RAM terdeteksi:</strong> ${data.detected_ram.join(', ')} GB<br>`;
                    }
                    if (infoHtml) {
                        detectedInfo.innerHTML = infoHtml;
                        detectedInfo.style.display = 'block';
                    } else {
                        detectedInfo.style.display = 'none';
                    }

                    // Tampilkan requirement game (dengan nama spesifikasi)
                    if (data.game_requirements && Object.keys(data.game_requirements).length > 0) {
                        requirementsArea.innerHTML = displayGameRequirements(data.game_requirements);
                        requirementsArea.style.display = 'block';
                    } else {
                        requirementsArea.style.display = 'none';
                    }

                    // Tampilkan selected specs (spesifikasi yang dipilih untuk filtering)
                    if (data.selected_specs) {
                        selectedSpecsArea.innerHTML = displaySelectedSpecs(data.selected_specs);
                        selectedSpecsArea.style.display = 'block';
                    } else {
                        selectedSpecsArea.style.display = 'none';
                    }

                    if (!data.data || data.data.length === 0) {
                        resultArea.innerHTML = '<div class="error">Tidak ada rekomendasi laptop yang ditemukan.</div>';
                        return;
                    }
                    displayResults(data.data);
                } else {
                    throw new Error(data.message || 'Kesalahan tidak diketahui');
                }
            } catch (error) {
                console.error('Error:', error);
                resultArea.innerHTML = `<div class="error">Gagal memuat data: ${error.message}</div>`;
            }
        }

        function displayGameRequirements(requirements) {
            let html = '<h3>📋 Persyaratan Game yang Terdeteksi</h3>';
            for (const [game, req] of Object.entries(requirements)) {
                html += `
                    <div class="game-req">
                        <h4>${escapeHtml(game)}</h4>
                        <div class="req-row"><strong>Minimum:</strong> CPU Intel ${escapeHtml(req.min.cpu_intel)} / AMD ${escapeHtml(req.min.cpu_amd)}, GPU NVIDIA ${escapeHtml(req.min.gpu_nvidia)} / AMD ${escapeHtml(req.min.gpu_amd)} / Intel ${escapeHtml(req.min.gpu_intel)}, RAM ${escapeHtml(req.min.ram)}, Storage ${escapeHtml(req.min.storage)}</div>
                        <div class="req-row"><strong>Recommended:</strong> CPU Intel ${escapeHtml(req.rec.cpu_intel)} / AMD ${escapeHtml(req.rec.cpu_amd)}, GPU NVIDIA ${escapeHtml(req.rec.gpu_nvidia)} / AMD ${escapeHtml(req.rec.gpu_amd)} / Intel ${escapeHtml(req.rec.gpu_intel)}, RAM ${escapeHtml(req.rec.ram)}, Storage ${escapeHtml(req.rec.storage)}</div>
                    </div>
                `;
            }
            return html;
        }

        function displaySelectedSpecs(specs) {
            let html = '<h3>⭐ Spesifikasi yang Digunakan untuk Filtering</h3><div class="spec-item">';
            html += '<div class="spec-title">Minimum (diambil dari game dengan persyaratan tertinggi):</div>';
            html += `<div class="spec-row">CPU Intel: ${escapeHtml(specs.min.cpu_intel.name)} (dari game ${escapeHtml(specs.min.cpu_intel.game)})</div>`;
            html += `<div class="spec-row">CPU AMD: ${escapeHtml(specs.min.cpu_amd.name)} (dari game ${escapeHtml(specs.min.cpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU NVIDIA: ${escapeHtml(specs.min.gpu_nvidia.name)} (dari game ${escapeHtml(specs.min.gpu_nvidia.game)})</div>`;
            html += `<div class="spec-row">GPU AMD: ${escapeHtml(specs.min.gpu_amd.name)} (dari game ${escapeHtml(specs.min.gpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU Intel: ${escapeHtml(specs.min.gpu_intel.name)} (dari game ${escapeHtml(specs.min.gpu_intel.game)})</div>`;
            html += `<div class="spec-row">RAM: ${specs.min.ram} GB</div>`;
            html += `<div class="spec-row">Storage: ${specs.min.storage} GB</div>`;

            html += '<div class="spec-title" style="margin-top: 10px;">Recommended (diambil dari game dengan persyaratan tertinggi):</div>';
            html += `<div class="spec-row">CPU Intel: ${escapeHtml(specs.rec.cpu_intel.name)} (dari game ${escapeHtml(specs.rec.cpu_intel.game)})</div>`;
            html += `<div class="spec-row">CPU AMD: ${escapeHtml(specs.rec.cpu_amd.name)} (dari game ${escapeHtml(specs.rec.cpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU NVIDIA: ${escapeHtml(specs.rec.gpu_nvidia.name)} (dari game ${escapeHtml(specs.rec.gpu_nvidia.game)})</div>`;
            html += `<div class="spec-row">GPU AMD: ${escapeHtml(specs.rec.gpu_amd.name)} (dari game ${escapeHtml(specs.rec.gpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU Intel: ${escapeHtml(specs.rec.gpu_intel.name)} (dari game ${escapeHtml(specs.rec.gpu_intel.game)})</div>`;
            html += `<div class="spec-row">RAM: ${specs.rec.ram} GB</div>`;
            html += `<div class="spec-row">Storage: ${specs.rec.storage} GB</div>`;
            html += '</div>';
            return html;
        }

        function displayResults(laptops) {
            const resultArea = document.getElementById('resultArea');
            let html = `
                 <table>
                    <thead>
                        <tr>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>CPU</th>
                            <th>GPU</th>
                            <th>RAM (GB)</th>
                            <th>Storage (GB)</th>
                            <th>Storage Type</th>
                            <th>Harga (Rp)</th>
                            <th>Kategori</th>
                            <th>Match Score</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            for (const laptop of laptops) {
                let categoryClass = '';
                if (laptop.Category === 'Recommended') categoryClass = 'category-recommended';
                else if (laptop.Category === 'Mixed') categoryClass = 'category-mixed';
                else if (laptop.Category === 'Minimum') categoryClass = 'category-minimum';

                const price = (laptop.Final_Price && !isNaN(laptop.Final_Price)) ? formatRupiah(laptop.Final_Price) : '-';
                const storageType = laptop.Storage_type ? escapeHtml(laptop.Storage_type) : '-';
                const matchScore = (laptop.Match_Score && !isNaN(laptop.Match_Score)) ? laptop.Match_Score.toFixed(2) : '-';

                html += `
                    <tr class="${categoryClass}">
                         <td>${escapeHtml(laptop.Brand)}</td>
                         <td>${escapeHtml(laptop.Model)}</td>
                         <td>${escapeHtml(laptop.CPU)}</td>
                         <td>${escapeHtml(laptop.GPU)}</td>
                         <td>${laptop.RAM}</td>
                         <td>${laptop.Storage}</td>
                         <td>${storageType}</td>
                         <td>${price}</td>
                         <td>${escapeHtml(laptop.Category)}</td>
                         <td>${matchScore}</td>
                     </tr>
                `;
            }
            html += `
                    </tbody>
                 </table>
                <div class="footer-note">Menampilkan ${laptops.length} laptop</div>
            `;
            resultArea.innerHTML = html;
        }

        function formatRupiah(amount) {
            return 'Rp ' + new Intl.NumberFormat('id-ID').format(amount);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
