<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Laptop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-form input {
            flex: 2;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }
        .search-form select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
        }
        .search-form button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-form button:hover {
            background-color: #0056b3;
        }
        .detected-info {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #495057;
        }
        .requirements, .selected-specs {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .game-req, .spec-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .game-req h4 {
            margin: 0 0 8px 0;
            color: #007bff;
        }
        .req-row, .spec-row {
            font-size: 0.85em;
            margin: 5px 0;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #888;
            margin: 20px;
        }
        .error {
            color: red;
            text-align: center;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .clickable-row {
            cursor: pointer;
        }
        .clickable-row:hover {
            background-color: #f1f1f1;
        }
        .category-recommended {
            background-color: #d4edda;
            color: #155724;
        }
        .category-mixed {
            background-color: #fff3cd;
            color: #856404;
        }
        .category-minimum {
            background-color: #cce5ff;
            color: #004085;
        }
        .footer-note {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .modal table {
            width: 100%;
            margin-bottom: 20px;
        }
        .modal th {
            width: 30%;
            background-color: #f2f2f2;
        }
        .modal td {
            background-color: white;
        }
        .game-comments {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rekomendasi Laptop</h1>
        <div class="search-form">
            <input type="text" id="query" placeholder="Contoh: laptop asus rog 16gb ram buat spiderman remastered" />
            <label for="limit" style="margin-left: 10px;">Jumlah:</label>
            <select id="limit">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <button onclick="search()">Cari Laptop</button>
        </div>
        <div id="detectedInfo" class="detected-info" style="display: none;"></div>
        <div id="requirementsArea" class="requirements" style="display: none;"></div>
        <div id="selectedSpecsArea" class="selected-specs" style="display: none;"></div>
        <div id="resultArea"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/recommend';
        let laptopsData = [];

        async function search() {
            const query = document.getElementById('query').value.trim();
            const limit = document.getElementById('limit').value;
            if (!query) {
                alert('Silakan masukkan query pencarian.');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const detectedInfo = document.getElementById('detectedInfo');
            const requirementsArea = document.getElementById('requirementsArea');
            const selectedSpecsArea = document.getElementById('selectedSpecsArea');
            resultArea.innerHTML = '<div class="loading">Memuat rekomendasi...</div>';
            detectedInfo.style.display = 'none';
            requirementsArea.style.display = 'none';
            selectedSpecsArea.style.display = 'none';
            laptopsData = [];

            try {
                const url = `${API_URL}?query=${encodeURIComponent(query)}&limit=${limit}`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                if (data.status === 'success') {
                    let infoHtml = '';
                    if (data.detected_games?.length) infoHtml += `<strong>🎮 Game terdeteksi:</strong> ${data.detected_games.join(', ')}<br>`;
                    if (data.detected_laptops?.length) infoHtml += `<strong>💻 Laptop/Brand terdeteksi:</strong> ${data.detected_laptops.join(', ')}<br>`;
                    if (data.detected_budget) infoHtml += `<strong>💰 Budget terdeteksi:</strong> Rp ${data.detected_budget}<br>`;
                    if (data.detected_ram?.length) infoHtml += `<strong>⚡ RAM terdeteksi:</strong> ${data.detected_ram.join(', ')} GB<br>`;
                    if (infoHtml) {
                        detectedInfo.innerHTML = infoHtml;
                        detectedInfo.style.display = 'block';
                    }

                    if (data.game_requirements && Object.keys(data.game_requirements).length) {
                        requirementsArea.innerHTML = displayGameRequirements(data.game_requirements);
                        requirementsArea.style.display = 'block';
                    }

                    if (data.selected_specs) {
                        selectedSpecsArea.innerHTML = displaySelectedSpecs(data.selected_specs);
                        selectedSpecsArea.style.display = 'block';
                    }

                    if (!data.data?.length) {
                        resultArea.innerHTML = '<div class="error">Tidak ada rekomendasi laptop.</div>';
                        return;
                    }
                    displayResults(data.data);
                } else {
                    throw new Error(data.message || 'Gagal');
                }
            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function displayGameRequirements(requirements) {
            let html = '<h3>📋 Persyaratan Game yang Terdeteksi</h3>';
            for (const [game, req] of Object.entries(requirements)) {
                html += `
                    <div class="game-req">
                        <h4>${escapeHtml(game)}</h4>
                        <div class="req-row"><strong>Minimum:</strong> CPU Intel ${escapeHtml(req.min.cpu_intel)} / AMD ${escapeHtml(req.min.cpu_amd)}, GPU NVIDIA ${escapeHtml(req.min.gpu_nvidia)} / AMD ${escapeHtml(req.min.gpu_amd)} / Intel ${escapeHtml(req.min.gpu_intel)}, RAM ${escapeHtml(req.min.ram)}, Storage ${escapeHtml(req.min.storage)}</div>
                        <div class="req-row"><strong>Recommended:</strong> CPU Intel ${escapeHtml(req.rec.cpu_intel)} / AMD ${escapeHtml(req.rec.cpu_amd)}, GPU NVIDIA ${escapeHtml(req.rec.gpu_nvidia)} / AMD ${escapeHtml(req.rec.gpu_amd)} / Intel ${escapeHtml(req.rec.gpu_intel)}, RAM ${escapeHtml(req.rec.ram)}, Storage ${escapeHtml(req.rec.storage)}</div>
                    </div>
                `;
            }
            return html;
        }

        function displaySelectedSpecs(specs) {
            let html = '<h3>⭐ Spesifikasi yang Digunakan untuk Filtering</h3><div class="spec-item">';
            html += '<div class="spec-title">Minimum:</div>';
            html += `<div class="spec-row">CPU Intel: ${escapeHtml(specs.min.cpu_intel.name)} (${escapeHtml(specs.min.cpu_intel.game)})</div>`;
            html += `<div class="spec-row">CPU AMD: ${escapeHtml(specs.min.cpu_amd.name)} (${escapeHtml(specs.min.cpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU NVIDIA: ${escapeHtml(specs.min.gpu_nvidia.name)} (${escapeHtml(specs.min.gpu_nvidia.game)})</div>`;
            html += `<div class="spec-row">GPU AMD: ${escapeHtml(specs.min.gpu_amd.name)} (${escapeHtml(specs.min.gpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU Intel: ${escapeHtml(specs.min.gpu_intel.name)} (${escapeHtml(specs.min.gpu_intel.game)})</div>`;
            html += `<div class="spec-row">RAM: ${specs.min.ram} GB</div><div class="spec-row">Storage: ${specs.min.storage} GB</div>`;
            html += '<div class="spec-title">Recommended:</div>';
            html += `<div class="spec-row">CPU Intel: ${escapeHtml(specs.rec.cpu_intel.name)} (${escapeHtml(specs.rec.cpu_intel.game)})</div>`;
            html += `<div class="spec-row">CPU AMD: ${escapeHtml(specs.rec.cpu_amd.name)} (${escapeHtml(specs.rec.cpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU NVIDIA: ${escapeHtml(specs.rec.gpu_nvidia.name)} (${escapeHtml(specs.rec.gpu_nvidia.game)})</div>`;
            html += `<div class="spec-row">GPU AMD: ${escapeHtml(specs.rec.gpu_amd.name)} (${escapeHtml(specs.rec.gpu_amd.game)})</div>`;
            html += `<div class="spec-row">GPU Intel: ${escapeHtml(specs.rec.gpu_intel.name)} (${escapeHtml(specs.rec.gpu_intel.game)})</div>`;
            html += `<div class="spec-row">RAM: ${specs.rec.ram} GB</div><div class="spec-row">Storage: ${specs.rec.storage} GB</div>`;
            html += '</div>';
            return html;
        }

        function displayResults(laptops) {
            const resultArea = document.getElementById('resultArea');
            laptopsData = laptops;

            // Buat tabel dengan createElement agar lebih aman
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headers = ['Brand', 'Model', 'CPU', 'GPU', 'RAM (GB)', 'Storage (GB)', 'Storage Type', 'Harga (Rp)', 'Kategori', 'Match Score'];
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            for (let i = 0; i < laptops.length; i++) {
                const l = laptops[i];
                const row = document.createElement('tr');
                row.className = `clickable-row ${l.Category === 'Recommended' ? 'category-recommended' : (l.Category === 'Mixed' ? 'category-mixed' : 'category-minimum')}`;
                row.setAttribute('data-index', i);
                const cells = [
                    l.Brand, l.Model, l.CPU, l.GPU,
                    l.RAM, l.Storage, l.Storage_type || '-',
                    formatRupiah(l.Final_Price), l.Category,
                    l.Match_Score ? l.Match_Score.toFixed(2) : '-'
                ];
                cells.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
            resultArea.innerHTML = '';
            resultArea.appendChild(table);

            const footer = document.createElement('div');
            footer.className = 'footer-note';
            footer.textContent = `Menampilkan ${laptops.length} laptop (klik baris untuk detail)`;
            resultArea.appendChild(footer);
        }

        function formatRupiah(amount) {
            return 'Rp ' + new Intl.NumberFormat('id-ID').format(amount);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Event listener untuk klik baris
        document.getElementById('resultArea').addEventListener('click', function(e) {
            const row = e.target.closest('.clickable-row');
            if (row) {
                const idx = row.getAttribute('data-index');
                if (idx !== null) showModal(parseInt(idx));
            }
        });

        function showModal(index) {
            const laptop = laptopsData[index];
            if (!laptop) return;

            const modal = document.createElement('div');
            modal.className = 'modal';
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '&times;';
            closeSpan.onclick = () => modal.remove();

            const title = document.createElement('h2');
            title.textContent = laptop.Laptop || `${laptop.Brand} ${laptop.Model}`;;

            const detailTable = document.createElement('table');
            const rows = [
                ['CPU', laptop.CPU],
                ['GPU', laptop.GPU],
                ['RAM', `${laptop.RAM} GB`],
                ['Storage', `${laptop.Storage} GB (${laptop.Storage_type || '-'})`],
                ['Harga', formatRupiah(laptop.Final_Price)],
                ['Kategori', laptop.Category],
                ['Match Score', laptop.Match_Score ? laptop.Match_Score.toFixed(2) : '-']
            ];
            rows.forEach(([label, value]) => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.textContent = label;
                const td = document.createElement('td');
                td.textContent = value;
                tr.appendChild(th);
                tr.appendChild(td);
                detailTable.appendChild(tr);
            });

            const commentsDiv = document.createElement('div');
            commentsDiv.className = 'game-comments';
            if (laptop.game_comments) {
                commentsDiv.innerHTML = `<h3>🎮 Komentar Performa Game</h3>${laptop.game_comments}`;
            } else {
                commentsDiv.innerHTML = `<h3>🎮 Komentar Performa Game</h3><p>Tidak ada komentar.</p>`;
            }

            modalContent.appendChild(closeSpan);
            modalContent.appendChild(title);
            modalContent.appendChild(detailTable);
            modalContent.appendChild(commentsDiv);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            modal.style.display = 'block';

            window.onclick = (event) => {
                if (event.target === modal) modal.remove();
            };
        }
    </script>
</body>
</html>
