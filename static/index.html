<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Laptop Hybrid (NLP + AHP + TOPSIS)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-form input {
            flex: 2;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }
        .search-form select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
        }
        .search-form button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-form button:hover {
            background-color: #0056b3;
        }
        .detected-info {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #495057;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #888;
            margin: 20px;
        }
        .error {
            color: #d32f2f;
            text-align: center;
            margin: 20px;
            padding: 15px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .clickable-row {
            cursor: pointer;
            background-color: #d4edda;
        }
        .clickable-row:hover {
            background-color: #c3e6cb;
        }
        .footer-note {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .modal table {
            width: 100%;
            margin-bottom: 20px;
        }
        .modal th {
            width: 30%;
            background-color: #f2f2f2;
        }
        .game-comments {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Rekomendasi Laptop Hybrid</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Menggunakan NLP Pipeline + Smart Filters (AHP) + TOPSIS Ranking
        </p>
        
        <div class="search-form">
            <input type="text" id="query" placeholder="Contoh: mau main hi3rd dengan budget 20 juta" />
            <label for="limit" style="margin-left: 10px;">Jumlah:</label>
            <select id="limit">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
            </select>
            <button onclick="search()">🔍 Cari Laptop</button>
        </div>
        
        <div id="detectedInfo" class="detected-info" style="display: none;"></div>
        <div id="resultArea"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/recommend-hybrid';
        let laptopsData = [];

        async function search() {
            const query = document.getElementById('query').value.trim();
            const limit = document.getElementById('limit').value;
            
            if (!query) {
                alert('Silakan masukkan query pencarian.');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const detectedInfo = document.getElementById('detectedInfo');
            
            resultArea.innerHTML = '<div class="loading">⏳ Memproses query dengan NLP, filtering, dan TOPSIS...</div>';
            detectedInfo.style.display = 'none';
            laptopsData = [];

            try {
                const requestBody = {
                    query: query,
                    top_n: parseInt(limit)
                };
                
                console.log('📤 Sending request:', requestBody);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📥 Response:', data);

                if (data.status === 'success') {
                    // Display extracted intent and filtering info
                    let infoHtml = '';
                    infoHtml += `<strong>🎯 Intent Terdeteksi:</strong> ${formatIntent(data.intent)}<br>`;
                    infoHtml += `<strong>✅ Filtered (Phase 1):</strong> ${data.filtered_count} laptop`;
                    
                    if (data.weights_applied && Object.keys(data.weights_applied).length) {
                        const weights = Object.entries(data.weights_applied)
                            .map(([k, v]) => `${k}: ${(v * 100).toFixed(1)}%`)
                            .join(', ');
                        infoHtml += `<br><strong>⚖️ Weights (AHP):</strong> ${weights}`;
                    }
                    
                    infoHtml += `<br><strong>📊 Ranked (Phase 2 TOPSIS):</strong> ${data.ranked_count} laptop`;
                    
                    detectedInfo.innerHTML = infoHtml;
                    detectedInfo.style.display = 'block';
                    
                    // Display system requirements if available
                    if (data.app_requirements && data.app_requirements.length > 0) {
                        displaySystemRequirements(data.app_requirements);
                    }

                    if (!data.recommendations || data.recommendations.length === 0) {
                        resultArea.innerHTML = `<div class="error">❌ ${data.message || 'Tidak ada rekomendasi laptop yang sesuai.'}</div>`;
                        return;
                    }
                    
                    displayResults(data.recommendations);
                } else {
                    throw new Error(data.message || 'Gagal mendapatkan rekomendasi');
                }
            } catch (error) {
                console.error('Error:', error);
                resultArea.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        function formatIntent(intent) {
            const display = {
                'FIND_LAPTOP_FOR_GAME': '🎮 Gaming',
                'FIND_LAPTOP_FOR_CONTENT_CREATION': '🎬 Content Creation',
                'AI_DEVELOPMENT': '🤖 AI Development',
                'PROGRAMMING': '💻 Programming',
                'WEB_DEVELOPMENT': '🌐 Web Development',
                'SCIENTIFIC_COMPUTING': '🔬 Scientific Computing',
                'DAILY_USE': '📱 Daily Use',
                'OFFICE_USE': '📊 Office',
                'LIGHT_TASKS': '⚡ Light Tasks',
                'FIND_LAPTOP_GENERAL': '📋 General'
            };
            return display[intent] || intent;
        }

        function displaySystemRequirements(appReqs) {
            const resultArea = document.getElementById('resultArea');
            
            // Create section for requirements
            const reqSection = document.createElement('div');
            reqSection.style.marginBottom = '20px';
            reqSection.style.backgroundColor = '#f0f8ff';
            reqSection.style.padding = '15px';
            reqSection.style.borderRadius = '8px';
            reqSection.style.borderLeft = '4px solid #4a90e2';
            
            const reqTitle = document.createElement('h3');
            reqTitle.textContent = '📋 Spesifikasi Sistem yang Dibutuhkan';
            reqTitle.style.marginTop = '0';
            reqSection.appendChild(reqTitle);
            
            const reqTable = document.createElement('table');
            reqTable.style.width = '100%';
            reqTable.style.borderCollapse = 'collapse';
            
            const reqThead = document.createElement('thead');
            const reqHeaderRow = document.createElement('tr');
            ['Game/App', 'CPU', 'GPU', 'RAM'].forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                th.style.padding = '10px';
                th.style.backgroundColor = '#4a90e2';
                th.style.color = 'white';
                th.style.textAlign = 'left';
                reqHeaderRow.appendChild(th);
            });
            reqThead.appendChild(reqHeaderRow);
            reqTable.appendChild(reqThead);
            
            const reqTbody = document.createElement('tbody');
            appReqs.forEach((req, idx) => {
                const row = document.createElement('tr');
                row.style.backgroundColor = idx % 2 === 0 ? '#ffffff' : '#f9f9f9';
                
                [req.app_name, req.cpu, req.gpu, req.ram].forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    td.style.padding = '10px';
                    td.style.borderBottom = '1px solid #ddd';
                    td.style.fontSize = '0.9em';
                    row.appendChild(td);
                });
                reqTbody.appendChild(row);
            });
            reqTable.appendChild(reqTbody);
            
            reqSection.appendChild(reqTable);
            resultArea.appendChild(reqSection);
        }

        function displayResults(recommendations) {
            const resultArea = document.getElementById('resultArea');
            laptopsData = recommendations.map(r => ({
                Brand: r.brand,
                Model: r.model,
                CPU_Name: r.specs.cpu_name || '-',
                CPU_Score: r.specs.cpu_score ? `${r.specs.cpu_score?.toFixed(0)}` : '-',
                GPU_Name: r.specs.gpu_name || '-',
                GPU_Score: r.specs.gpu_score ? `${r.specs.gpu_score?.toFixed(0)}` : '-',
                RAM: r.specs.ram,
                RAM_Type: r.specs.ram_type || '-',
                Storage: r.specs.storage,
                Storage_type: 'SSD',
                Final_Price: r.specs.final_price,
                Match_Score: r.topsis_score,
                Laptop: `${r.brand} ${r.model}`,
                Reasoning: r.reasoning,
                TOPSIS_Score: r.topsis_score
            }));

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headers = ['No', 'Brand', 'Model', 'CPU', 'GPU', 'RAM', 'Storage (GB)', 'Harga (Rp)', 'TOPSIS Score'];
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            recommendations.forEach((r, idx) => {
                const row = document.createElement('tr');
                row.className = 'clickable-row';
                row.setAttribute('data-index', idx);
                const cpuDisplay = r.specs.cpu_name ? `${r.specs.cpu_name}` : (r.specs.cpu_score ? `${r.specs.cpu_score.toFixed(0)}` : '-');
                const gpuDisplay = r.specs.gpu_name ? `${r.specs.gpu_name}` : (r.specs.gpu_score ? `${r.specs.gpu_score.toFixed(0)}` : '-');
                const ramDisplay = r.specs.ram ? `${r.specs.ram}GB ${r.specs.ram_type || ''}` : '-';
                const cells = [
                    r.rank || (idx + 1),
                    r.brand,
                    r.model,
                    cpuDisplay,
                    gpuDisplay,
                    ramDisplay,
                    r.specs.storage,
                    formatRupiah(r.specs.final_price),
                    r.topsis_score.toFixed(4)
                ];
                cells.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });
            table.appendChild(tbody);
            
            // Add title for recommendations
            const recTitle = document.createElement('h3');
            recTitle.textContent = '🏆 Rekomendasi Laptop';
            recTitle.style.marginTop = '30px';
            resultArea.appendChild(recTitle);
            
            resultArea.appendChild(table);

            const footer = document.createElement('div');
            footer.className = 'footer-note';
            footer.textContent = `✨ Menampilkan ${recommendations.length} laptop hasil TOPSIS ranking (klik baris untuk detail)`;
            resultArea.appendChild(footer);
        }

        function formatRupiah(amount) {
            return 'Rp ' + new Intl.NumberFormat('id-ID').format(amount);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Event listener untuk klik baris
        document.getElementById('resultArea').addEventListener('click', function(e) {
            const row = e.target.closest('.clickable-row');
            if (row) {
                const idx = row.getAttribute('data-index');
                if (idx !== null) showModal(parseInt(idx));
            }
        });

        function showModal(index) {
            const laptop = laptopsData[index];
            if (!laptop) return;

            const modal = document.createElement('div');
            modal.className = 'modal';
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '&times;';
            closeSpan.onclick = () => modal.remove();

            const title = document.createElement('h2');
            title.textContent = `${laptop.Brand} ${laptop.Model}`;

            const detailTable = document.createElement('table');
            const rows = [
                ['CPU', laptop.CPU_Name],
                ['CPU Score', laptop.CPU_Score],
                ['GPU', laptop.GPU_Name],
                ['GPU Score', laptop.GPU_Score],
                ['RAM', `${laptop.RAM} GB`],
                ['RAM Type', laptop.RAM_Type],
                ['Storage', `${laptop.Storage} GB (${laptop.Storage_type || '-'})`],
                ['Harga', formatRupiah(laptop.Final_Price)],
                ['TOPSIS Score', laptop.TOPSIS_Score ? laptop.TOPSIS_Score.toFixed(4) : '-']
            ];
            rows.forEach(([label, value]) => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.textContent = label;
                const td = document.createElement('td');
                td.textContent = value;
                tr.appendChild(th);
                tr.appendChild(td);
                detailTable.appendChild(tr);
            });

            const commentsDiv = document.createElement('div');
            commentsDiv.className = 'game-comments';
            if (laptop.Reasoning) {
                commentsDiv.innerHTML = `<h3>💡 Alasan Rekomendasi</h3><p>${escapeHtml(laptop.Reasoning)}</p>`;
            } else {
                commentsDiv.innerHTML = `<h3>💡 Alasan Rekomendasi</h3><p>Laptop ini cocok untuk kebutuhan Anda berdasarkan skor TOPSIS.</p>`;
            }

            modalContent.appendChild(closeSpan);
            modalContent.appendChild(title);
            modalContent.appendChild(detailTable);
            modalContent.appendChild(commentsDiv);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            modal.style.display = 'block';

            window.onclick = (event) => {
                if (event.target === modal) modal.remove();
            };
        }
    </script>
</body>
</html>
